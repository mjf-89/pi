name: Publish Android diagnostic log export

on:
  push:
    branches: [release/android-poc-export-logs]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json
      - name: Select Java and install SDK packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix android
      - name: Build and validate APK
        working-directory: android
        run: |
          npm run bundle
          npm run check
          node --test test/*.test.mjs
          mkdir -p /tmp/javet-probe
          curl -fsSL https://repo.maven.apache.org/maven2/com/caoccao/javet/javet/6.0.1/javet-6.0.1.jar -o /tmp/javet-probe/javet.jar
          curl -fsSL https://repo.maven.apache.org/maven2/com/caoccao/javet/javet-node-linux-x86_64-i18n/6.0.1/javet-node-linux-x86_64-i18n-6.0.1.jar -o /tmp/javet-probe/node.jar
          javac -cp /tmp/javet-probe/javet.jar -d /tmp/javet-probe test/RuntimeProbe.java
          java -cp /tmp/javet-probe:/tmp/javet-probe/javet.jar:/tmp/javet-probe/node.jar RuntimeProbe
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Attach APK and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk pi-android-poc-arm64.apk
          sha256sum pi-android-poc-arm64.apk > SHA256SUMS
          cat > /tmp/preview-notes.md <<'NOTES'
          Adds **Export diagnostics** to the main screen and error dialogs. Reproduce the sign-in failure, tap Export diagnostics, and save the JSON file using Android's file picker.

          The log includes the installed version and commit, Android network/VPN/Private DNS state, native and Node DNS lookup outcomes, OAuth stages, HTTP status codes, durations, and sanitized error causes. The bounded log survives app restarts. It excludes tokens, authorization codes, callback URLs, headers, response bodies, device IDs and conversation text. Unknown fields and values are removed before persistence and export.

          Download `pi-android-poc-arm64.apk` for ARM64 Android phones, including Nothing devices. Requires Android 8.0 or newer. This is the regular **Pi Durable** app. Earlier previews used disposable CI debug keys: uninstall the original Pi Durable app before installing this build. Uninstalling clears that app's local data. The separate Diagnostics app can remain installed.

          Validation passed: APK compilation, Android lint, TypeScript checks, native diagnostic-log privacy/persistence/concurrency tests, JavaScript HTTP diagnostics and runtime/DNS tests, embedded Javet HTTP/DNS checks, and APK signature verification. The persistent ENOTFOUND failure on the affected phone remains under investigation; attach the exported JSON after reproducing it.

          The APK was built on GitHub Actions. SHA-256 is recorded in the attached SHA256SUMS file.
          NOTES
          gh release create android-poc-preview-0.1.3 pi-android-poc-arm64.apk SHA256SUMS --repo mjf-89/pi --target "$GITHUB_SHA" --prerelease --latest=false --title 'Android PoC 0.1.3 — Export diagnostics' --notes-file /tmp/preview-notes.md
