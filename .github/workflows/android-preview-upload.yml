name: Publish Android accessibility preview

on:
  push:
    branches: [release/android-poc-accessibility]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json
      - name: Select Java and install SDK packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix android
      - name: Build and validate APK
        working-directory: android
        run: |
          npm run bundle
          npm run check
          node --test test/*.test.mjs
          mkdir -p /tmp/javet-probe
          curl -fsSL https://repo.maven.apache.org/maven2/com/caoccao/javet/javet/6.0.1/javet-6.0.1.jar -o /tmp/javet-probe/javet.jar
          curl -fsSL https://repo.maven.apache.org/maven2/com/caoccao/javet/javet-node-linux-x86_64-i18n/6.0.1/javet-node-linux-x86_64-i18n-6.0.1.jar -o /tmp/javet-probe/node.jar
          javac -cp /tmp/javet-probe/javet.jar -d /tmp/javet-probe test/RuntimeProbe.java
          java -cp /tmp/javet-probe:/tmp/javet-probe/javet.jar:/tmp/javet-probe/node.jar RuntimeProbe
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Attach APK and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk pi-android-poc-arm64.apk
          sha256sum pi-android-poc-arm64.apk > SHA256SUMS
          cat > /tmp/preview-notes.md <<'NOTES'
          Adds **Run device task**: choose one app, describe a task, and let Pi inspect its accessibility controls and navigate. First milestone: choose Settings and ask Pi to open About phone and report the device model without changing settings.

          Enable Pi Durable in Android Accessibility settings yourself, then return to Pi to start a task. For sideloaded apps Android may require **Allow restricted settings** in App info first. Screen text from the selected app goes to OpenAI and is stored in the local conversation. Password and Android-marked sensitive nodes are excluded. Diagnostic exports still exclude screen and conversation text.

          Taps, text entry and Back require **Allow once** on the phone. A floating **Stop Pi** button and foreground-service notification end access. Tasks are limited to one selected app, five minutes and 60 operations; access is revoked after completion or process death. Stale nodes are rejected, actions return fresh observations, and interrupted actions are not automatically replayed. The foreground service supports model networking while another app is visible.

          Download `pi-android-poc-arm64.apk` for ARM64 Android phones, including Nothing devices. Requires Android 8.0 or newer. This is the regular **Pi Durable** app. Earlier previews used disposable CI debug keys: uninstall the original Pi Durable app before installing this build. Uninstalling clears that app's local data. The separate Diagnostics app can remain installed.

          Validation: TypeScript and Android compilation/lint; fake-model Settings tool loop; native session expiry/budget/revocation tests; bridge cancellation and stale-response tests; embedded Javet model-to-Java tool execution; existing OAuth/DNS/privacy checks. The accessibility and foreground-service flow still needs validation on Android hardware. Semantic controls only: no screenshots, coordinate gestures, or cross-app automation in this preview.

          The APK was built on GitHub Actions. SHA-256 is recorded in the attached SHA256SUMS file.
          NOTES
          gh release create android-poc-preview-0.1.5 pi-android-poc-arm64.apk SHA256SUMS --repo mjf-89/pi --target "$GITHUB_SHA" --prerelease --latest=false --title 'Android PoC 0.1.5 — Accessibility device tasks' --notes-file /tmp/preview-notes.md
