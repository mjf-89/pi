name: Publish Android automation preview

on:
  push:
    branches: [release/android-poc-fast-navigation]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json
      - name: Select Java and install SDK packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix android
      - name: Build and validate APK
        working-directory: android
        run: |
          npm run bundle
          npm run check
          node --test test/*.test.mjs
          mkdir -p /tmp/javet-probe
          curl -fsSL https://repo.maven.apache.org/maven2/com/caoccao/javet/javet/6.0.1/javet-6.0.1.jar -o /tmp/javet-probe/javet.jar
          curl -fsSL https://repo.maven.apache.org/maven2/com/caoccao/javet/javet-node-linux-x86_64-i18n/6.0.1/javet-node-linux-x86_64-i18n-6.0.1.jar -o /tmp/javet-probe/node.jar
          javac -cp /tmp/javet-probe/javet.jar -d /tmp/javet-probe test/RuntimeProbe.java
          java -cp /tmp/javet-probe:/tmp/javet-probe/javet.jar:/tmp/javet-probe/node.jar RuntimeProbe
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Attach APK and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk pi-android-poc-arm64.apk
          sha256sum pi-android-poc-arm64.apk > SHA256SUMS
          cat > /tmp/preview-notes.md <<'NOTES'
          **Run device task** now chooses the appropriate installed app automatically and can switch apps when needed for your task. Disable **Choose apps automatically** to restrict it to one app. Routine actions run without prompts by default; enable **Confirm each action** to restore step-by-step approval. Preferences are saved.

          Device tasks default to **gpt-6-luna** with reasoning off. Choose another device-task model in the task dialog. The previous chat model is restored after completion, cancellation, or restart. Actions wait 250 ms before observing the screen (350 ms for app launches), and the model is instructed to reuse fresh observations instead of requesting duplicate reads. Phone latency has not been benchmarked.

          The floating control is now a compact dark **Pi** pill with a clear stop icon and 48 dp touch target. Drag the Pi label to reposition it. Chat uses a matching stop icon, visible only while working. Stop revokes device access immediately.

          Enable Pi Durable in Android Accessibility settings yourself. Sideloaded apps may need **Allow restricted settings** in App info first. App names and visible screen text go to OpenAI and are stored in the local conversation. Password and Android-marked sensitive nodes are excluded. Diagnostic exports exclude screen and conversation text. Model-marked consequential actions, checkable controls, and labels such as Send, Pay or Delete still require **Allow once**. These are heuristics, not a guarantee of detecting every consequential action.

          Tasks expire after five minutes or 60 operations. Native code enforces the allowed app list, stale-node checks and ephemeral authorization. Interrupted actions are not automatically replayed. Semantic accessibility controls only; no screenshots or coordinate gestures.

          Download `pi-android-poc-arm64.apk` for ARM64 Android phones, including Nothing devices. Requires Android 8.0 or newer. This is the regular **Pi Durable** app. Earlier previews used disposable CI debug keys: uninstall the original Pi Durable app before installing this build. Uninstalling clears that app's local data. The separate Diagnostics app can remain installed.

          Validation: TypeScript and Android compilation/lint; fake-model app selection and fast-model tool loop; cancellation and chat-model restoration/restart tests; native app scope and confirmation policy tests; embedded Javet model-to-Java tool execution; existing OAuth/DNS/privacy checks. The 0.1.6 behavior and controls still need validation on Android hardware. The broader repository check has an existing unrelated Cloudflare model-name fixture failure.

          The APK was built on GitHub Actions. SHA-256 is recorded in the attached SHA256SUMS file.
          NOTES
          gh release create android-poc-preview-0.1.6 pi-android-poc-arm64.apk SHA256SUMS --repo mjf-89/pi --target "$GITHUB_SHA" --prerelease --latest=false --title 'Android PoC 0.1.6 — Automatic apps, fast navigation and compact Stop' --notes-file /tmp/preview-notes.md
